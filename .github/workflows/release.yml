name: Build and publish Windows installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set release version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Tag must use a version such as v1.0.0; received '$env:GITHUB_REF_NAME'."
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force artifacts\publish, artifacts\installer | Out-Null

      - name: Publish self-contained app
        run: dotnet publish .\StreamMultiviewer.csproj --configuration Release --runtime win-x64 --self-contained true --output .\artifacts\publish

      - name: Download WebView2 Runtime installer
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile ".\artifacts\WebView2Bootstrapper.exe"

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler not found at '$compiler'."
          }
          & $compiler "/DAppVersion=$env:APP_VERSION" ".\installer\StreamMultiviewer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Stream Multiviewer ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/installer/StreamMultiviewer-Setup.exe
